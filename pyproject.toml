[project]
name = "ow-slm"
version = "0.1.0"
description = "Scraping des wikis Overwatch (Fandom, Liquipedia) pour le projet SLM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests",
    "mwparserfromhell",
    "beautifulsoup4",
    "lxml",
    "tqdm",
    "rapidfuzz",
    "numpy>=2.5.3",
]

[project.scripts]
ow-scrape = "scraper.cli:main"
ow-bench = "bench.cli:main"
ow-rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper", "gen", "bench", "rag"]
