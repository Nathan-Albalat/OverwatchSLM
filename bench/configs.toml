# Configurations evaluees par `ow-bench run <nom>`.
# Backends : ollama | openai | claude_cli | manual
# rag = {k = 5} : les k passages les plus proches sont donnes au modele (module rag.retrieve : hybride bm25+dense, repli bm25 si pas d'embeddings).

[defaults]
temperature = 0
max_tokens = 512

# SLM de base : memes poids et meme quantification (GGUF Q4_K_M Unsloth) que les modeles fine-tunes exportes.
[[config]]
name = "qwen3-4b-base"
backend = "ollama"
model = "hf.co/unsloth/Qwen3-4B-GGUF:Q4_K_M"
think = false

[[config]]
name = "qwen3-4b-rag"
backend = "ollama"
model = "hf.co/unsloth/Qwen3-4B-GGUF:Q4_K_M"
think = false
rag = {k = 4}

[[config]]
name = "qwen3-1.7b-base"
backend = "ollama"
model = "hf.co/unsloth/Qwen3-1.7B-GGUF:Q4_K_M"
think = false

[[config]]
name = "qwen3-1.7b-rag"
backend = "ollama"
model = "hf.co/unsloth/Qwen3-1.7B-GGUF:Q4_K_M"
think = false
rag = {k = 4}

[[config]]
name = "qwen3-14b"
backend = "ollama"
model = "qwen3:14b"
think = false

[[config]]
name = "qwen3-14b-rag"
backend = "ollama"
model = "qwen3:14b"
think = false
rag = {k = 5}

[[config]]
name = "claude-sonnet-rag"
backend = "claude_cli"
model = "sonnet"
rag = {k = 5}

[[config]]
name = "claude-opus"
backend = "claude_cli"
model = "opus"

[[config]]
name = "claude-sonnet"
backend = "claude_cli"
model = "sonnet"

# Exemple de SLM fine-tune servi par llama.cpp / vLLM (WSL) :
# [[config]]
# name = "slm-sft"
# backend = "openai"
# model = "ow-slm-sft"
# base_url = "http://localhost:8080/v1"
# vram_mb = 4500

# SLM fine-tunes (train/ -> export GGUF -> `ollama create ow-<run> -f data\train\<run>\gguf\Modelfile`).
# k = 4 pour les bras SLM + RAG (base et RAFT) : les exemples RAFT sont construits avec k = 4, on compare a contexte egal.
# Les configs frontier et 14B + RAG gardent k = 5 (le run claude-sonnet-rag existe deja en k = 5).
[[config]]
name = "slm-4b-sft"
backend = "ollama"
model = "ow-qwen3-4b-sft"
think = false

[[config]]
name = "slm-4b-cpt-sft"
backend = "ollama"
model = "ow-qwen3-4b-cpt-sft"
think = false

[[config]]
name = "slm-4b-raft-rag"
backend = "ollama"
model = "ow-qwen3-4b-raft"
think = false
rag = {k = 4}

[[config]]
name = "slm-4b-raft-v2-rag"
backend = "ollama"
model = "ow-qwen3-4b-raft-v2"
think = false
rag = {k = 4}

[[config]]
name = "slm-1.7b-raft-rag"
backend = "ollama"
model = "ow-qwen3-1.7b-raft"
think = false
rag = {k = 4}


# LLM frontier + recherche web (outil WebSearch de Claude Code) : le concurrent qui « se met a jour » sans RAG.
# Lance sur les questions temporelles seulement (--ids). Cout = tokens + 10 $ / 1 000 recherches (compte dans meta.usage).
[[config]]
name = "claude-sonnet-web"
backend = "claude_cli"
model = "sonnet"
tools = "WebSearch"
system_extra = "You can use the WebSearch tool to look up current information about Overwatch before answering."
